name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do that you can't today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea for how it could work
  - type: markdown
    attributes:
      value: EngineMonitor stays offline and runs without administrator rights; ideas that need either are unlikely to be accepted.
