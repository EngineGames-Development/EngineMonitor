[package]
name = "enginemonitor"
version = "0.1.0"
description = "EngineMonitor — a cross-platform desktop system monitor"
authors = ["EngineMonitor contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "enginemonitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sysinfo = { version = "0.40.3", default-features = false, features = ["system", "disk", "network"] }
rusqlite = { version = "0.43", features = ["bundled"] }

# Windows: own implementations where sysinfo is insufficient.
# - Process termination needs precise error codes (access denied vs. not
#   found); sysinfo shells out to taskkill and discards them.
# - GPU: sysinfo sums all engine counters (e.g. 3D + video = 92 % where Task
#   Manager shows 49 %) and read 0 bytes of dedicated memory on the dev
#   machine, so a DXGI + PDH provider is used instead.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_Graphics_Dxgi",
] }

# Elsewhere sysinfo's GPU support is the provider (not verified on hardware).
[target.'cfg(not(windows))'.dependencies]
sysinfo = { version = "0.40.3", default-features = false, features = ["gpu"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# "unwind" (not "abort") so a panic in an optional collector such as a GPU
# provider can be contained with catch_unwind instead of killing the app.
panic = "unwind"
strip = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
